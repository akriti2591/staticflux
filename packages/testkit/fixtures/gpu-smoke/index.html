<!doctype html>
<meta charset="utf-8" />
<title>StaticFlux GPU smoke</title>
<!--
  Smoke page for the real-GPU runner (`runGpuPage` / `sf-gpu-run packages/testkit/fixtures/gpu-smoke`).
  1. Renders a triangle into a 64×64 rgba8unorm texture and reads it back (golden `gpu-smoke-triangle`).
  2. Renders the same triangle into a WebGPU canvas for two presented frames and reads the canvas texture
     back. Presenting is what loses the device on SwiftShader without the ANGLE flags (S1 spike).
  Publishes globalThis.__sfGpuResult per the testkit page protocol (see gpu-readback.ts). Plain JS on purpose:
  pages under test normally bundle `readbackTexture` from @staticflux/testkit; this one stays dependency-free.
-->
<canvas id="c" width="64" height="64"></canvas>
<script type="module">
  const SIZE = 64;
  const publish = (payload) => (globalThis.__sfGpuResult = payload);
  const base64 = (bytes) => {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
  const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));

  const WGSL = /* wgsl */ `
    @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
      var p = array<vec2f, 3>(vec2f(0.0, 0.75), vec2f(-0.75, -0.75), vec2f(0.75, -0.5));
      return vec4f(p[i], 0.0, 1.0);
    }
    @fragment fn fs() -> @location(0) vec4f { return vec4f(1.0, 0.5, 0.0, 1.0); }
  `;

  async function readback(device, texture) {
    const bytesPerRow = Math.ceil((SIZE * 4) / 256) * 256;
    const buffer = device.createBuffer({ size: bytesPerRow * SIZE, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    const encoder = device.createCommandEncoder();
    encoder.copyTextureToBuffer({ texture }, { buffer, bytesPerRow, rowsPerImage: SIZE }, [SIZE, SIZE]);
    device.queue.submit([encoder.finish()]);
    await buffer.mapAsync(GPUMapMode.READ);
    const padded = new Uint8Array(buffer.getMappedRange());
    const out = new Uint8Array(SIZE * SIZE * 4);
    for (let y = 0; y < SIZE; y++) out.set(padded.subarray(y * bytesPerRow, y * bytesPerRow + SIZE * 4), y * SIZE * 4);
    buffer.unmap();
    buffer.destroy();
    if (texture.format.startsWith('bgra')) for (let i = 0; i < out.length; i += 4) [out[i], out[i + 2]] = [out[i + 2], out[i]];
    return { width: SIZE, height: SIZE, rgba: base64(out) };
  }

  function draw(device, pipeline, view) {
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({ colorAttachments: [{ view, loadOp: 'clear', storeOp: 'store', clearValue: { r: 0.1, g: 0.2, b: 0.4, a: 1 } }] });
    pass.setPipeline(pipeline);
    pass.draw(3);
    pass.end();
    device.queue.submit([encoder.finish()]);
  }

  try {
    if (!navigator.gpu) throw new Error('navigator.gpu is missing (not a secure context, or WebGPU disabled)');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('requestAdapter() returned null');
    const device = await adapter.requestDevice();
    const lost = { lost: false, reason: null, message: null };
    device.lost.then((info) => Object.assign(lost, { lost: true, reason: info.reason, message: info.message }));
    const errors = [];
    device.addEventListener('uncapturederror', (e) => errors.push(e.error.message));
    const module = device.createShaderModule({ code: WGSL });
    const pipelineFor = (format) => device.createRenderPipeline({ layout: 'auto', vertex: { module, entryPoint: 'vs' }, fragment: { module, entryPoint: 'fs', targets: [{ format }] }, primitive: { topology: 'triangle-list' } });

    // 1. Offscreen texture.
    const texture = device.createTexture({ size: [SIZE, SIZE], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    draw(device, pipelineFor('rgba8unorm'), texture.createView());
    const triangle = await readback(device, texture);

    // 2. Canvas presentation (two frames).
    const format = navigator.gpu.getPreferredCanvasFormat();
    const context = document.getElementById('c').getContext('webgpu');
    context.configure({ device, format, alphaMode: 'opaque', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const canvasPipeline = pipelineFor(format);
    let canvas;
    let presented = 0;
    for (let frame = 0; frame < 2; frame++) {
      const current = context.getCurrentTexture();
      draw(device, canvasPipeline, current.createView());
      if (frame === 1) canvas = await readback(device, current);
      await nextFrame();
      presented++;
    }
    await device.queue.onSubmittedWorkDone();
    await nextFrame();

    publish({ ok: true, data: { canvasFormat: format, presented, lost, errors }, images: { triangle, canvas } });
  } catch (e) {
    publish({ ok: false, error: { message: String(e?.message ?? e) } });
  }
</script>
