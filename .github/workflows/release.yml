name: Release

# Publishing is ON DEMAND only: Actions → Release → Run workflow.
# It runs every check, then publishes any @staticflux/* version not yet on npm
# (one at a time, rate-limit aware — see `sf publish`). Merging to main never publishes.
# Version bumps + changelogs are prepared by the Version workflow (version.yml).
on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write        # version commits / tags
  id-token: write        # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # Publishing is sequential with backoff on npm rate limits (sf publish), so allow time for retries.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm CLI (pnpm hands the tarball to npm).
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:boundaries
      - run: pnpm lint:sf
      - run: pnpm errors:check
      - run: pnpm size
      - name: Publish (sequential, rate-limit aware)
        run: node tooling/sf/dist/cli.js publish
        env:
          # Only needed for the very first publish (before trusted publishers are configured).
          # Remove the NPM_TOKEN secret afterwards; OIDC is used when it is absent.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Push release tags
        if: always()
        run: git push origin --tags
