# Instaflow engines: one Rust workspace, built to Wasm by `pnpm build` (`sf wasm build`, IF-2.10).
# Build config (crates, wasm-opt level, SIMD) lives in sf-wasm.json; budgets in /.size-limit.wasm.json.
[workspace]
resolver = "2"
members = ["crates/render", "crates/authoring"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Exact pins: `sf wasm build` installs the wasm-bindgen CLI whose version matches the locked crate.
# Render stack = the versions the S1 spike measured (vello_gpu 0.3.0 + wgpu 30.0.1, WebGPU only).
[workspace.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["OffscreenCanvas", "console"] }
vello_common = { version = "=0.3.0", default-features = false, features = ["std"] }
vello_gpu = { version = "=0.3.0", default-features = false, features = ["wgpu"] }
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "u8_pipeline"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
png = "=0.18.1"
# Glyph outlines for the render crate (B2): the skrifa version Parley 0.12 uses; no hinting (render/src/glyphs.rs).
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
# Text (B2, S3): Parley 0.12 (HarfRust shaping, ICU4X bidi and line breaking) without system fonts or
# `complex-scripts` (that feature is only enabled by the lazy `authoring-complex` build, see sf-wasm.json).
parley = { version = "=0.12.0", default-features = false, features = ["std"] }

# Size-first release profile (research/03 §2.2, S1). SIMD comes from RUSTFLAGS (+simd128), set by `sf wasm build`.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
