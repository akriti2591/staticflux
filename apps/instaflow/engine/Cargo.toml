# Instaflow engines: one Rust workspace, built to Wasm by `pnpm build` (`sf wasm build`, IF-2.10).
# Build config (crates, wasm-opt level, SIMD) lives in sf-wasm.json; budgets in /.size-limit.wasm.json.
[workspace]
resolver = "2"
members = ["crates/render", "crates/authoring", "crates/export"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Exact pins: `sf wasm build` installs the wasm-bindgen CLI whose version matches the locked crate.
# Render stack = the versions the S1 spike measured (vello_gpu 0.3.0 + wgpu 30.0.1, WebGPU only).
[workspace.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["OffscreenCanvas", "console"] }
vello_common = { version = "=0.3.0", default-features = false, features = ["std"] }
vello_gpu = { version = "=0.3.0", default-features = false, features = ["wgpu"] }
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "u8_pipeline"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
png = "=0.18.1"
# Glyph outlines for the render crate (B2): the skrifa version Parley 0.12 uses; no hinting (render/src/glyphs.rs).
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
# Text (B2, S3): Parley 0.12 (HarfRust shaping, ICU4X bidi and line breaking) without system fonts or
# `complex-scripts` (that feature is only enabled by the lazy `authoring-complex` build, see sf-wasm.json).
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
# Authoring geometry (B1): kurbo paths (the same 0.13.1 vello_common uses, so one copy) and linesweeper booleans (IF-7.9).
kurbo = { version = "=0.13.1", default-features = false, features = ["std"] }
linesweeper = { version = "=0.5.0", default-features = false }
# Export (C1): pdf-writer (the PDF primitives krilla is built on) writes the PDF; flate2 compresses its streams and the
# SVG writer's PNG data URIs; base64 encodes them. krilla itself measured 481 KB brotli in the export Wasm (its font
# scaler links skrifa's hinters; subsetter, write-fonts and image decoders), over the 400 KB IF-15.1 budget.
pdf-writer = { version = "=0.15.0", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
# Web fonts (B12, T-7): WOFF2 (Brotli) and WOFF (zlib) uploads decoded to OpenType in the lazy `authoring-webfont`
# build only (sf-wasm.json), so neither the Brotli dictionary nor the decoder weighs on the text build.
wuff = { version = "=0.2.9", default-features = false, features = ["brotli", "z"] }
# Host tests only: resvg rasterizes the SVG writer's output for the parity corpus (D21).
resvg = { version = "=0.48.1", default-features = false, features = ["raster-images"] }

# Size-first release profile (research/03 §2.2, S1). SIMD comes from RUSTFLAGS (+simd128), set by `sf wasm build`.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
