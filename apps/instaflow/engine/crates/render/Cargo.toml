[package]
name = "render"
description = "Instaflow render engine: scene IR, Vello GPU tiles and lifted layers, our WGSL compositor (IF-7.4, IF-7.5)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# `gpu` (default): the render Wasm's exports (Vello GPU engine, compositor, readback). The export crate (C1) depends
# on this crate without it, for the scene IR and the one draw traversal only (no GPU code, no render exports).
[features]
default = ["gpu"]
gpu = ["dep:vello_gpu", "dep:wgpu", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[dependencies]
wasm-bindgen = { workspace = true }
vello_common = { workspace = true }
skrifa = { workspace = true }

# The GPU path exists only in the Wasm build (WebGPU in the render worker).
[target.'cfg(target_arch = "wasm32")'.dependencies]
vello_gpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

# The CPU reference rasterizer (CI goldens, GPU-vs-CPU parity) never ships in the Wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true }
png = { workspace = true }
