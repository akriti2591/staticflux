<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S4 CRDT spike</title>
<style>
  body { font: 13px/1.4 ui-monospace, monospace; margin: 16px; background: #fff; color: #111; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>S4 — Loro vs Yjs (browser, module workers)</h1>
<p>Query: <code>?runs=3&amp;reps=5&amp;phases=boot,open,gestures,merge,history,correctness&amp;mergeN=1000,10000</code>. Each sample runs in a fresh module worker. Results land in <code>window.__result</code> and below.</p>
<pre id="log"></pre>
<script type="module">
const q = new URLSearchParams(location.search);
const runs = Number(q.get('runs') ?? 3);
const reps = Number(q.get('reps') ?? 5);
const phases = (q.get('phases') ?? 'boot,open,gestures,merge,history,milestone,correctness').split(',');
const logEl = document.getElementById('log');
const log = (s) => { logEl.textContent += s + '\n'; };
const median = (xs) => { const s = [...xs].sort((a, b) => a - b); return s[Math.floor((s.length - 1) / 2)]; };
const p95 = (xs) => { const s = [...xs].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.ceil(0.95 * s.length) - 1)]; };
const st = (xs) => ({ n: xs.length, median: +median(xs).toFixed(2), p95: +p95(xs).toFixed(2), all: xs.map((x) => +x.toFixed(1)) });

async function uaMemory(label) {
  if (!self.crossOriginIsolated || !performance.measureUserAgentSpecificMemory) return null;
  const t = performance.now();
  let r;
  try { r = await Promise.race([performance.measureUserAgentSpecificMemory(), new Promise((res) => setTimeout(() => res(null), 60000))]); }
  catch (e) { return { label, error: String(e.message ?? e) }; }
  if (!r) return { label, timeout: true };
  return { label, totalMB: +(r.bytes / 2 ** 20).toFixed(1), tookMs: Math.round(performance.now() - t), breakdown: r.breakdown.filter((b) => b.bytes > 1e6).map((b) => ({ MB: +(b.bytes / 2 ** 20).toFixed(1), types: b.types, scope: b.attribution?.map((a) => a.scope).join(',') })) };
}

function runWorker(msg, transfer) {
  return new Promise((resolve, reject) => {
    const w = new Worker('dist/worker.js', { type: 'module' });
    w.onmessage = async (ev) => {
      const m = ev.data;
      if (m.type === 'log') log('  ' + m.text);
      else if (m.type === 'mem') w.postMessage({ type: 'memdone', value: await uaMemory(m.label) });
      else if (m.type === 'result') { w.terminate(); resolve(m.out); }
      else if (m.type === 'error') { w.terminate(); reject(new Error(m.error)); }
    };
    w.onerror = (e) => { w.terminate(); reject(new Error(e.message)); };
    w.postMessage(msg, transfer ?? []);
  });
}

const result = { ua: navigator.userAgent, crossOriginIsolated: self.crossOriginIsolated, cores: navigator.hardwareConcurrency, runs, reps };
try {
  if (phases.includes('boot')) {
    log('boot: fresh workers, compileStreaming + instantiate');
    const fresh = [];
    for (let i = 0; i < 8; i++) fresh.push((await runWorker({ type: 'run', phase: 'boot', streaming: true })).boot);
    const bytesFresh = [];
    for (let i = 0; i < 4; i++) bytesFresh.push((await runWorker({ type: 'run', phase: 'boot', streaming: false })).boot);
    const module = await WebAssembly.compileStreaming(fetch('/node_modules/loro-crdt/web/loro_wasm_bg.wasm'));
    const warm = [];
    for (let i = 0; i < 8; i++) warm.push((await runWorker({ type: 'run', phase: 'boot', module })).boot);
    const glue = await runWorker({ type: 'run', phase: 'fresh-glue', module });
    result.boot = {
      freshWorkerCompileStreamingMs: st(fresh.map((b) => b.compileMs)), freshWorkerInstantiateMs: st(fresh.map((b) => b.instantiateMs)),
      freshWorkerCompileFromBytesMs: st(bytesFresh.map((b) => b.compileMs)),
      warmWorkerInstantiateFromPostedModuleMs: st(warm.map((b) => b.instantiateMs)),
      warmSameWorkerFreshGlueInstantiateMs: st(glue.warmInstantiateFromCompiledModuleMs),
    };
    log(JSON.stringify(result.boot));
  }
  if (phases.includes('open')) {
    result.openLoro = []; result.openYjs = [];
    for (let r = 0; r < runs; r++) {
      log(`open run ${r + 1}/${runs}`);
      result.openLoro.push((await runWorker({ type: 'run', phase: 'open-loro', reps })).out);
      result.openYjs.push((await runWorker({ type: 'run', phase: 'open-yjs', reps })).out);
      log('  loro first ' + JSON.stringify(result.openLoro.at(-1).first) + ' | yjs first ' + JSON.stringify(result.openYjs.at(-1).first));
    }
  }
  if (phases.includes('gestures')) {
    result.gestures = [];
    for (let r = 0; r < runs; r++) { log(`gestures run ${r + 1}`); result.gestures.push((await runWorker({ type: 'run', phase: 'perf', reps, only: ['gestures'] })).out); }
  }
  if (phases.includes('merge')) {
    result.merge = {};
    const kinds = (q.get('mergeKinds') ?? 'loro-cold,loro-warm,loro-pages,yjs').split(',');
    for (const N of (q.get('mergeN') ?? '1000,10000').split(',').map(Number)) for (const kind of kinds) {
      const key = `${kind}_${N}`; result.merge[key] = [];
      for (let r = 0; r < runs; r++) { const o = (await runWorker({ type: 'run', phase: 'merge1', kind, N })).out; result.merge[key].push(o); log(`merge ${key} run ${r + 1}: import ${o.importMs ?? o.importMsTotal} ms`); }
    }
  }
  if (phases.includes('history')) {
    result.history = [];
    for (const [cps, ms] of [[[0, 10000, 50000], false], [[100000], false], [[200000], false]]) { log(`history ${cps}`); result.history.push((await runWorker({ type: 'run', phase: 'perf', reps, only: ['history'], checkpoints: cps, milestone: ms })).out); }
  }
  if (phases.includes('milestone')) { log('milestone'); result.milestone = (await runWorker({ type: 'run', phase: 'perf', reps, only: ['milestone'] })).out; }
  if (phases.includes('correctness')) { log('correctness'); result.correctness = (await runWorker({ type: 'run', phase: 'correctness' })).out; }
} catch (e) { result.error = String(e.stack ?? e); log('ERROR ' + result.error); }
log('done');
window.__result = result;
</script>
</body>
</html>
