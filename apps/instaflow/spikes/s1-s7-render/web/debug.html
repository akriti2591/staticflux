<!doctype html><meta charset="utf-8"><canvas id="c" width="1280" height="720"></canvas>
<script type="module">
const off = document.getElementById('c').transferControlToOffscreen();
const w = new Worker('./debug-worker.js', { type: 'module' });
w.onmessage = (e) => { window.__result = e.data; };
w.postMessage({ canvas: off, count: +(new URLSearchParams(location.search).get('count') ?? 10000) }, [off]);
</script>
